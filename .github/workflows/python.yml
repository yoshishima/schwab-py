name: tests

permissions:
  contents: read

on:
- push
- pull_request
- workflow_dispatch

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
        python:
        - version: "3.14"
          toxenv: py314
        - version: "3.13"
          toxenv: py313
        - version: "3.12"
          toxenv: py312
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python.version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python.version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[dev]"

    - name: Test with tox ${{ matrix.python.toxenv }}
      env:
        TOXENV: ${{ matrix.python.toxenv }}
      run: tox

    - name: Report coverage
      if: matrix.python.version == '3.14'
      run: |
        coverage combine
        coverage report
        coverage xml

    - name: Upload coverage to Codecov  
      if: matrix.python.version == '3.14'
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: GitHub

    - name: Check twine
      if: matrix.python.version == '3.14'
      run: |
        python -m build
        python -m twine check dist/*

  readthedocs-test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python:
        - version: "3.14"
          toxenv: py314
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python.version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python.version }}

    - name: Install dependencies
      run: |
        python -m pip install -r docs/requirements.txt

    - name: Verify that documentation builds
      run: |
        sphinx-build -W docs/ docs-build

  callback-startup-diagnostic:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install callback dependencies
      run: python -m pip install .
    - name: Diagnose local callback startup
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/schwab_callback_probe.py" <<'PY'
        import faulthandler
        import sys
        import time
        import multiprocess
        import httpx2 as httpx
        from schwab import auth

        def serve(queue):
            faulthandler.dump_traceback_later(5, file=sys.stderr)
            try:
                getattr(auth, '__run_client_from_login_flow_server')(
                    queue, 6969, '/callback', 'ci-loopback-probe')
            finally:
                faulthandler.cancel_dump_traceback_later()

        if __name__ == '__main__':
            context = multiprocess.get_context('spawn')
            queue = context.Queue()
            server = context.Process(target=serve, args=(queue,))
            server.start()
            deadline = time.monotonic() + 15
            last_error = None
            try:
                while time.monotonic() < deadline and server.exitcode is None:
                    try:
                        response = httpx.get(
                            'https://127.0.0.1:6969/schwab-py-internal/status',
                            verify=False, timeout=1)
                        print('Local readiness:', response.status_code,
                              response.text == 'ci-loopback-probe', flush=True)
                        break
                    except (httpx.ConnectError, httpx.TimeoutException) as exc:
                        last_error = repr(exc)
                        time.sleep(0.1)
                else:
                    print('Local callback did not become ready; exit code:',
                          server.exitcode, 'last probe error:', last_error,
                          flush=True)
            finally:
                if server.is_alive():
                    server.terminate()
                server.join(timeout=5)
        PY
        python -u "$RUNNER_TEMP/schwab_callback_probe.py"
